<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js test</title>
</head>
<body>
    <div>
        <p id="heading1">THE DOM</p>
        <h2>The document object model</h2>
    <button id="myButton">Test</button>
    </div>
    <script>
        function handleEvent(event){
            event.target.style.backgroundColor='yellow';
        }
        let but = document.getElementById('myButton');

        but.addEventListener('click', handleEvent);
    </script>
</body>
</html>
